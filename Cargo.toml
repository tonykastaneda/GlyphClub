[package]
name = "glyphclub"
version = "0.2.2"
edition = "2021"
default-run = "GlyphClub"
autobins = false

# The GPUI application is the standard executable on both platforms.
[[bin]]
name = "GlyphClub"
path = "src/gui/main.rs"

# glyphclub-cli: libraries, fonts and activation from the terminal, and
# driving the running app's UI over its local bridge.
[[bin]]
name = "glyphclub-cli"
path = "src/cli/main.rs"

[dependencies]
anyhow = "1"
dirs = "7"
rayon = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
ttf-parser = "0.25"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The update check: one blocking GET against the GitHub releases API on a
# background thread, so a small synchronous client rather than an async
# runtime.
ureq = { version = "3", features = ["json"] }
# The app's UI (src/gui): gpui plus its component library.
gpui-kit = "0.8.0"
# glyphclub-cli's argument parsing.
clap = { version = "4.6", features = ["derive"] }
# Watching library folders for changes.
notify-debouncer-mini = "0.7.0"
filetime = "0.2.29"
# Local-time formatting for the list view's Date Added column.
chrono = "0.4"
# Decodes the branding PNGs for the menu bar / system tray icon and icon
# drag previews. png-only.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
# The system tray icon (see `tray.rs`).
tray-icon = { version = "0.24", default-features = false }

# AppKit/Foundation for the dock icon, the icon drag pasteboard and reading
# a file's Date Added.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSView", "NSApplication", "NSImage", "NSRunningApplication", "NSResponder", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSData", "NSUserDefaults", "NSString", "NSURL", "NSDate", "NSError"] }
# The menu bar icon (see `tray.rs`), same crate as Windows' system tray.
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(windows)'.build-dependencies]
# Embeds branding/windows/GlyphClub.ico into the built .exe itself (see
# build.rs) — distinct from the runtime taskbar/title-bar icon `image`
# already sets from the PNG (above): without this, the .exe file shown in
# Explorer/the taskbar before the app is even running has no icon of its
# own.
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.9" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos-0.3.9" }
