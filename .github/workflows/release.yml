name: Release

# Push a tag like v0.1.0 (or run this manually with a version input) to
# build, sign, notarize, and publish a GitHub Release with a macOS DMG and
# a Windows zip attached. See scripts/package-macos.sh and
# scripts/package-windows.ps1 for what each platform's job actually runs —
# this workflow is mostly just credentials plumbing and artifact wiring
# around those two scripts.
#
# One-time setup this needs before it'll work (see README's "Releasing"
# section): the six `secrets.*` referenced below have to exist in this
# repo's Settings → Secrets and variables → Actions.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0) — only needed for a manual run off a non-tag commit"
        required: false
  # release-internal.yml runs these same jobs as a draft.
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      draft:
        type: boolean
        default: false

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify signing and notarization credentials
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for name in APPLE_SIGN_IDENTITY MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychain -d user -s build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Write notarization API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      # The macOS Illustrator plug-in is built on the Mac that has Adobe's
      # SDK and committed as plugin/prebuilt (scripts/update-prebuilt-plugin.sh);
      # package-macos.sh checks it matches plugin/ and signs it.
      - name: Build, sign, notarize, package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/package/macos/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # The Illustrator plug-in needs Adobe's SDK, which can't be committed
      # here (Adobe's license doesn't allow a plain public copy). An
      # encrypted copy is in this repo's own "sdk-illustrator-2026"
      # pre-release; the SDK_KEY secret decrypts it.
      - name: Download Illustrator SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_KEY: ${{ secrets.SDK_KEY }}
        run: |
          if [ -z "$SDK_KEY" ]; then
            echo "::warning::No SDK_KEY secret; the Windows zip won't include the Illustrator plug-in"
            exit 0
          fi
          gh release download sdk-illustrator-2026 --repo "$GITHUB_REPOSITORY" --pattern AdobeIllustratorSDK.zip.enc --dir "$RUNNER_TEMP"
          printf '%s' "$SDK_KEY" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/AdobeIllustratorSDK.zip.enc" -out "$RUNNER_TEMP/AdobeIllustratorSDK.zip" -pass stdin
          7z x -y -bd -o"$RUNNER_TEMP/sdk" "$RUNNER_TEMP/AdobeIllustratorSDK.zip" > /dev/null
          echo "AI_SDK=$RUNNER_TEMP/sdk/AdobeIllustratorSDK" >> "$GITHUB_ENV"
          echo "REQUIRE_PLUGIN=1" >> "$GITHUB_ENV"

      - name: Build Illustrator plug-in
        if: env.AI_SDK != ''
        run: ./scripts/build-windows-plugin.ps1

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REQUIRE_INSTALLER: "1"
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            target/package/*.zip
            target/package/GlyphClub-Setup.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-zip/*.zip
            artifacts/windows-zip/GlyphClub-Setup.exe
          # Published as Latest, unless release-internal.yml asked for a
          # draft (its tag is made when the draft is published).
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          draft: ${{ inputs.draft == true }}
          make_latest: ${{ inputs.draft == true && 'false' || 'true' }}
          generate_release_notes: true
